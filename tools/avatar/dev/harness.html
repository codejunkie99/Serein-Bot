<!doctype html>
<html><head><meta charset="utf-8"><title>Relay avatar harness</title>
<style>html,body{margin:0;height:100%;background:#02040b;overflow:hidden}#stage{position:fixed;inset:0}</style></head>
<body><div id="stage"></div>
<script src="../../../Sources/Serein/Avatar/avatar.bundle.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const preset = RelayAvatar.presets.find((p) => p.name === (q.get('preset') || 'Serein')) || RelayAvatar.presets[0];
  window.events = [];
  window.relayAvatar = RelayAvatar.create(document.getElementById('stage'), {
    look: preset, state: q.get('state') || 'idle', transparent: q.get('transparent') === '1',
    quality: q.get('quality') || 'high', theme: q.get('theme') || 'dark', onEvent: (e) => window.events.push(e),
  });
</script></body></html>
